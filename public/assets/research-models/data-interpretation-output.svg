<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="800" height="600" fill="#ffffff"/>
  <text x="40" y="52" font-size="22" font-weight="700" fill="#0d1330">Data Interpretation Output</text>
  <text x="40" y="76" font-size="13" fill="#4a5568">Regression coefficients with 95% confidence intervals</text>

  <!-- results table -->
  <rect x="40" y="100" width="330" height="300" rx="12" fill="#eef1f8"/>
  <text x="60" y="130" font-size="13" font-weight="700" fill="#0d1330">Multiple Regression Results</text>
  <line x1="60" y1="148" x2="350" y2="148" stroke="#93b4ff" stroke-width="1.5"/>
  <g font-size="11.5" font-weight="700" fill="#4a5568">
    <text x="60" y="170">Predictor</text>
    <text x="210" y="170">&#946;</text>
    <text x="260" y="170">t</text>
    <text x="315" y="170">p</text>
  </g>
  <g font-size="12" fill="#0d1330">
    <text x="60" y="198">Study Hours</text><text x="200" y="198">0.44</text><text x="250" y="198">7.92</text><text x="303" y="198">&lt;.001</text>
    <text x="60" y="228">Prior GPA</text><text x="200" y="228">0.31</text><text x="250" y="228">5.44</text><text x="303" y="228">&lt;.001</text>
    <text x="60" y="258">Attendance</text><text x="200" y="258">0.22</text><text x="250" y="258">3.87</text><text x="303" y="258">&lt;.001</text>
    <text x="60" y="288">Motivation</text><text x="200" y="288">0.15</text><text x="250" y="288">2.51</text><text x="303" y="288">.013</text>
    <text x="60" y="318">Anxiety</text><text x="200" y="318">&#8722;0.12</text><text x="250" y="318">&#8722;2.10</text><text x="303" y="318">.037</text>
  </g>
  <line x1="60" y1="336" x2="350" y2="336" stroke="#93b4ff" stroke-width="1.5"/>
  <text x="60" y="362" font-size="12" font-weight="700" fill="#0d1330">R&#178; = 0.57 &#183; Adj. R&#178; = 0.56</text>
  <text x="60" y="384" font-size="12" fill="#4a5568">F(5, 406) = 108.3, p &lt; .001</text>

  <!-- coefficient plot -->
  <rect x="410" y="100" width="350" height="300" rx="12" fill="#eef1f8"/>
  <text x="430" y="130" font-size="13" font-weight="700" fill="#0d1330">Coefficient Plot (95% CI)</text>
  <line x1="585" y1="150" x2="585" y2="370" stroke="#93b4ff" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="585" y="388" font-size="10.5" fill="#4a5568" text-anchor="middle">0</text>
  <g stroke="#2b59f5" stroke-width="3" stroke-linecap="round">
    <line x1="642" y1="176" x2="742" y2="176"/>
    <line x1="626" y1="220" x2="706" y2="220"/>
    <line x1="612" y1="264" x2="676" y2="264"/>
    <line x1="596" y1="308" x2="654" y2="308"/>
    <line x1="500" y1="352" x2="572" y2="352"/>
  </g>
  <g fill="#0d1330">
    <circle cx="692" cy="176" r="7"/>
    <circle cx="666" cy="220" r="7"/>
    <circle cx="644" cy="264" r="7"/>
    <circle cx="625" cy="308" r="7" fill="#c9a227"/>
    <circle cx="536" cy="352" r="7" fill="#c9a227"/>
  </g>
  <g font-size="10.5" fill="#4a5568" text-anchor="end">
    <text x="575" y="180">Study Hours</text>
    <text x="575" y="224">Prior GPA</text>
    <text x="575" y="268">Attendance</text>
    <text x="490" y="312">Motivation</text>
    <text x="490" y="340">Anxiety</text>
  </g>

  <!-- interpretation strip -->
  <rect x="40" y="430" width="720" height="110" rx="12" fill="#0d1330"/>
  <text x="65" y="462" font-size="13" font-weight="700" fill="#c9a227">Interpretation</text>
  <g font-size="12.5" fill="#dbe4fb">
    <text x="65" y="488">Study hours is the strongest predictor of performance (&#946; = 0.44, p &lt; .001).</text>
    <text x="65" y="512">The model explains 57% of variance &#8212; a large effect by Cohen's benchmarks.</text>
  </g>
</svg>
