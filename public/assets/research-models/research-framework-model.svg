<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="800" height="600" fill="#ffffff"/>
  <text x="40" y="52" font-size="22" font-weight="700" fill="#0d1330">Research Framework Model</text>
  <text x="40" y="76" font-size="13" fill="#4a5568">Conceptual framework with hypothesised relationships</text>

  <defs>
    <marker id="arr5" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2b59f5"/>
    </marker>
  </defs>

  <!-- IV group -->
  <rect x="40" y="120" width="220" height="330" rx="14" fill="#eef1f8"/>
  <text x="150" y="150" font-size="12" font-weight="700" fill="#4a5568" text-anchor="middle" letter-spacing="1">INDEPENDENT VARIABLES</text>
  <g>
    <rect x="65" y="170" width="170" height="56" rx="10" fill="#ffffff" stroke="#2b59f5" stroke-width="2"/>
    <text x="150" y="203" font-size="13" font-weight="600" fill="#0d1330" text-anchor="middle">Content Quality</text>
    <rect x="65" y="246" width="170" height="56" rx="10" fill="#ffffff" stroke="#2b59f5" stroke-width="2"/>
    <text x="150" y="279" font-size="13" font-weight="600" fill="#0d1330" text-anchor="middle">Trainer Expertise</text>
    <rect x="65" y="322" width="170" height="56" rx="10" fill="#ffffff" stroke="#2b59f5" stroke-width="2"/>
    <text x="150" y="355" font-size="13" font-weight="600" fill="#0d1330" text-anchor="middle">Learning Support</text>
  </g>

  <!-- mediator -->
  <rect x="350" y="245" width="170" height="76" rx="10" fill="#2b59f5"/>
  <text x="435" y="278" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Learner</text>
  <text x="435" y="298" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Engagement</text>

  <!-- DV -->
  <rect x="600" y="245" width="160" height="76" rx="10" fill="#0d1330"/>
  <text x="680" y="278" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Skill</text>
  <text x="680" y="298" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Application</text>

  <!-- control -->
  <rect x="360" y="440" width="150" height="52" rx="26" fill="#ffffff" stroke="#c9a227" stroke-width="2.5"/>
  <text x="435" y="462" font-size="12" font-weight="700" fill="#0d1330" text-anchor="middle">Controls</text>
  <text x="435" y="479" font-size="10.5" fill="#4a5568" text-anchor="middle">Age &#183; Discipline</text>

  <g stroke="#2b59f5" stroke-width="2.2" fill="none" marker-end="url(#arr5)">
    <line x1="235" y1="198" x2="342" y2="262"/>
    <line x1="235" y1="274" x2="342" y2="280"/>
    <line x1="235" y1="350" x2="342" y2="300"/>
    <line x1="520" y1="283" x2="592" y2="283"/>
  </g>
  <line x1="435" y1="440" x2="435" y2="329" stroke="#c9a227" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr5)"/>

  <g font-size="12.5" font-weight="700" fill="#0d1330">
    <text x="272" y="215">H1</text>
    <text x="278" y="266">H2</text>
    <text x="272" y="342">H3</text>
    <text x="544" y="272">H4</text>
  </g>

  <text x="40" y="545" font-size="11" fill="#4a5568">Hypotheses H1&#8211;H3: direct effects &#183; H4: mediated pathway to outcome</text>
  <rect x="40" y="560" width="230" height="4" rx="2" fill="#c9a227"/>
</svg>
