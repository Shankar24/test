<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="800" height="600" fill="#ffffff"/>
  <text x="40" y="52" font-size="22" font-weight="700" fill="#0d1330">PLS-SEM Path Model</text>
  <text x="40" y="76" font-size="13" fill="#4a5568">Measurement and structural model &#183; standardised estimates</text>

  <!-- indicators SQ -->
  <g fill="#eef1f8" stroke="#93b4ff" stroke-width="1.5">
    <rect x="40" y="150" width="70" height="34" rx="6"/>
    <rect x="40" y="200" width="70" height="34" rx="6"/>
    <rect x="40" y="250" width="70" height="34" rx="6"/>
  </g>
  <g font-size="13" fill="#0d1330" text-anchor="middle">
    <text x="75" y="172">SQ1</text><text x="75" y="222">SQ2</text><text x="75" y="272">SQ3</text>
  </g>
  <g stroke="#93b4ff" stroke-width="1.5">
    <line x1="110" y1="167" x2="185" y2="205"/>
    <line x1="110" y1="217" x2="185" y2="217"/>
    <line x1="110" y1="267" x2="185" y2="230"/>
  </g>
  <g font-size="11" fill="#4a5568">
    <text x="128" y="180">0.86</text><text x="128" y="212">0.91</text><text x="128" y="258">0.83</text>
  </g>

  <!-- latent SQ -->
  <ellipse cx="255" cy="217" rx="72" ry="42" fill="#2b59f5"/>
  <text x="255" y="212" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">Service</text>
  <text x="255" y="230" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">Quality</text>

  <!-- latent SAT -->
  <ellipse cx="470" cy="217" rx="72" ry="42" fill="#0d1330"/>
  <text x="470" y="206" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">Customer</text>
  <text x="470" y="224" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">Satisfaction</text>
  <text x="470" y="242" font-size="11" fill="#93b4ff" text-anchor="middle">R&#178; = 0.62</text>

  <!-- latent LOY -->
  <ellipse cx="655" cy="400" rx="72" ry="42" fill="#0d1330"/>
  <text x="655" y="395" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">Loyalty</text>
  <text x="655" y="415" font-size="11" fill="#93b4ff" text-anchor="middle">R&#178; = 0.54</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c9a227"/>
    </marker>
  </defs>
  <g stroke="#c9a227" stroke-width="2.5" fill="none" marker-end="url(#arr)">
    <line x1="327" y1="217" x2="392" y2="217"/>
    <line x1="516" y1="248" x2="600" y2="372"/>
    <path d="M 300 250 Q 420 420 578 408"/>
  </g>
  <g font-size="13" font-weight="700" fill="#0d1330">
    <text x="342" y="205">&#946; = 0.79***</text>
    <text x="560" y="300">&#946; = 0.68***</text>
    <text x="360" y="392">&#946; = 0.21*</text>
  </g>

  <!-- indicators SAT -->
  <g fill="#eef1f8" stroke="#93b4ff" stroke-width="1.5">
    <rect x="435" y="90" width="70" height="30" rx="6"/>
    <rect x="530" y="110" width="70" height="30" rx="6"/>
  </g>
  <g font-size="12" fill="#0d1330" text-anchor="middle">
    <text x="470" y="110">SAT1</text><text x="565" y="130">SAT2</text>
  </g>
  <g stroke="#93b4ff" stroke-width="1.5">
    <line x1="470" y1="120" x2="470" y2="175"/>
    <line x1="552" y1="140" x2="505" y2="182"/>
  </g>

  <!-- legend -->
  <g font-size="11" fill="#4a5568">
    <text x="40" y="520">*** p &lt; 0.001 &#183; * p &lt; 0.05</text>
    <text x="40" y="542">Composite reliability &gt; 0.85 &#183; AVE &gt; 0.60</text>
  </g>
  <rect x="40" y="560" width="230" height="4" rx="2" fill="#c9a227"/>
</svg>
