<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="800" height="600" fill="#ffffff"/>
  <text x="40" y="52" font-size="22" font-weight="700" fill="#0d1330">Mediation &amp; Moderation Model</text>
  <text x="40" y="76" font-size="13" fill="#4a5568">Conditional process analysis &#183; PROCESS Model 7</text>

  <defs>
    <marker id="arr3" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2b59f5"/>
    </marker>
    <marker id="arr3g" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c9a227"/>
    </marker>
  </defs>

  <!-- mediator -->
  <rect x="330" y="150" width="150" height="64" rx="10" fill="#2b59f5"/>
  <text x="405" y="178" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Motivation</text>
  <text x="405" y="198" font-size="11" fill="#dbe4fb" text-anchor="middle">(Mediator M)</text>

  <!-- X -->
  <rect x="80" y="330" width="160" height="64" rx="10" fill="#eef1f8" stroke="#0d1330" stroke-width="2"/>
  <text x="160" y="358" font-size="14" font-weight="700" fill="#0d1330" text-anchor="middle">Training Quality</text>
  <text x="160" y="378" font-size="11" fill="#4a5568" text-anchor="middle">(Independent X)</text>

  <!-- Y -->
  <rect x="570" y="330" width="160" height="64" rx="10" fill="#0d1330"/>
  <text x="650" y="358" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Performance</text>
  <text x="650" y="378" font-size="11" fill="#93b4ff" text-anchor="middle">(Outcome Y)</text>

  <!-- moderator -->
  <rect x="110" y="120" width="150" height="56" rx="28" fill="#ffffff" stroke="#c9a227" stroke-width="2.5"/>
  <text x="185" y="144" font-size="13" font-weight="700" fill="#0d1330" text-anchor="middle">Experience</text>
  <text x="185" y="162" font-size="11" fill="#4a5568" text-anchor="middle">(Moderator W)</text>

  <!-- paths -->
  <g stroke="#2b59f5" stroke-width="2.4" fill="none" marker-end="url(#arr3)">
    <line x1="205" y1="330" x2="342" y2="222"/>
    <line x1="468" y1="222" x2="608" y2="330"/>
    <line x1="240" y1="362" x2="562" y2="362"/>
  </g>
  <line x1="212" y1="176" x2="262" y2="262" stroke="#c9a227" stroke-width="2.4" marker-end="url(#arr3g)"/>

  <g font-size="13" font-weight="700" fill="#0d1330">
    <text x="222" y="270">a = 0.52***</text>
    <text x="512" y="270">b = 0.47***</text>
    <text x="360" y="352">c&#8242; = 0.19*</text>
    <text x="255" y="205" fill="#c9a227">a&#215;W = 0.14*</text>
  </g>

  <!-- effects table -->
  <rect x="480" y="440" width="280" height="120" rx="12" fill="#eef1f8"/>
  <text x="500" y="468" font-size="13" font-weight="700" fill="#0d1330">Indirect Effect (a &#215; b)</text>
  <g font-size="12.5" fill="#4a5568">
    <text x="500" y="492">Effect = 0.244</text>
    <text x="500" y="514">Boot 95% CI [0.158, 0.339]</text>
    <text x="500" y="536">Mediation supported &#10003;</text>
  </g>

  <text x="40" y="545" font-size="11" fill="#4a5568">*** p &lt; 0.001 &#183; * p &lt; 0.05 &#183; 5,000 bootstrap samples</text>
</svg>
